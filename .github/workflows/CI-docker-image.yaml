name: Docker Image CI
 
on:
  push:
    branches: ["CI-CD"]
jobs:
  build_and_test:
     runs-on: self-hosted
     steps:
       - name: Checkout code
         uses: actions/checkout@v3
 
       - name: Set up Java
         uses: actions/setup-java@v3
         with:
           distribution: 'temurin'
           java-version: '17'
 
       - name: Build API
         run: make build
 
       - name: Run Tests
         run: make test
