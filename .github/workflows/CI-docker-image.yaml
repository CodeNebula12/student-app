name: Docker Image CI

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
      
jobs:
  build_and_test:
    runs-on: example-runner-deployment-r4cql-r64m8
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build API
        run: make build

      - name: Run Tests
        run: make test
